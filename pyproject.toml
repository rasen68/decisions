[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisions"
version = "0.1.0"
description = "Ask decision questions from Python or the command line"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
decisions = "decisions.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["decisions"]
